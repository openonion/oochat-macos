name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/openonion/oochat-macos-agent

jobs:
  publish:
    name: Build and publish multi-architecture image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify tagged image is publicly pullable
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker logout ghcr.io
          docker pull "${IMAGE_NAME}:${GITHUB_REF_NAME#v}"

  release-macos:
    name: Build and publish macOS app
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected_image="${IMAGE_NAME}:${version}"
          configured_image=$(/usr/libexec/PlistBuddy \
            -c "Print :ConnectOnionDockerImage" \
            ConnectOnionMacClient/Info.plist)
          if [[ "$configured_image" != "$expected_image" ]]; then
            echo "::error::Info.plist image '$configured_image' must equal '$expected_image'."
            exit 1
          fi

      - name: Archive app (ad-hoc signed)
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive_path="$RUNNER_TEMP/ConnectOnionMacClient.xcarchive"
          xcodebuild \
            -project ConnectOnionMacClient.xcodeproj \
            -scheme ConnectOnionMacClient \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$archive_path" \
            clean archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$version" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Create DMG
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive_path="$RUNNER_TEMP/ConnectOnionMacClient.xcarchive"
          staging_path="$RUNNER_TEMP/dmg-staging"
          artifact_path="$RUNNER_TEMP/ConnectOnionMacClient-${version}.dmg"

          mkdir -p "$staging_path"
          ditto \
            "$archive_path/Products/Applications/ConnectOnionMacClient.app" \
            "$staging_path/ConnectOnionMacClient.app"
          ln -s /Applications "$staging_path/Applications"
          hdiutil create \
            -volname "ConnectOnion Mac Client" \
            -srcfolder "$staging_path" \
            -ov \
            -format UDZO \
            "$artifact_path"
          shasum -a 256 "$artifact_path" > "${artifact_path}.sha256"

      - name: Publish GitHub release
        run: |
          version="${GITHUB_REF_NAME#v}"
          artifact_path="$RUNNER_TEMP/ConnectOnionMacClient-${version}.dmg"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$artifact_path" \
              "${artifact_path}.sha256" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$artifact_path" \
              "${artifact_path}.sha256" \
              --verify-tag \
              --generate-notes \
              --title "ConnectOnion Mac Client ${version}"
          fi
