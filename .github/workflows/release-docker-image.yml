name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/openonion/oochat-macos-agent

jobs:
  verify:
    name: Validate source and release version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Run pre-publication audit
        run: ./scripts/audit_repo.sh .

      - name: Validate release tag against source
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::'$tag' is not v<major>.<minor>.<patch>[-prerelease]."
            exit 1
          }
          version="${tag#v}"
          base_version="${version%%-*}"
          project_versions=$(sed -n 's/.*MARKETING_VERSION = \([^;]*\);/\1/p' \
            ConnectOnionMacClient.xcodeproj/project.pbxproj | sort -u)
          [ "$project_versions" = "$base_version" ] || {
            echo "::error::Tag $tag does not match MARKETING_VERSION $project_versions."
            exit 1
          }
          configured_image=$(python3 - <<'PY'
          import plistlib
          with open("ConnectOnionMacClient/Info.plist", "rb") as handle:
              print(plistlib.load(handle)["ConnectOnionDockerImage"])
          PY
          )
          expected_image="${IMAGE_NAME}:${version}"
          [ "$configured_image" = "$expected_image" ] || {
            echo "::error::Info.plist image '$configured_image' must equal '$expected_image'."
            exit 1
          }

  publish:
    name: Build and publish multi-architecture image
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify tagged image is publicly pullable
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker logout ghcr.io
          docker pull "${IMAGE_NAME}:${GITHUB_REF_NAME#v}"

  release-macos:
    name: Build and publish macOS app
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run Swift tests
        run: |
          # Tests use @testable imports; the archive step separately compiles Release.
          xcodebuild test \
            -project ConnectOnionMacClient.xcodeproj \
            -scheme ConnectOnionMacClient \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Validate release tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected_image="${IMAGE_NAME}:${version}"
          configured_image=$(/usr/libexec/PlistBuddy \
            -c "Print :ConnectOnionDockerImage" \
            ConnectOnionMacClient/Info.plist)
          if [[ "$configured_image" != "$expected_image" ]]; then
            echo "::error::Info.plist image '$configured_image' must equal '$expected_image'."
            exit 1
          fi

      - name: Archive app (ad-hoc signed)
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive_path="$RUNNER_TEMP/ConnectOnionMacClient.xcarchive"
          xcodebuild \
            -project ConnectOnionMacClient.xcodeproj \
            -scheme ConnectOnionMacClient \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$archive_path" \
            clean archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$version" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Create DMG
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive_path="$RUNNER_TEMP/ConnectOnionMacClient.xcarchive"
          staging_path="$RUNNER_TEMP/dmg-staging"
          artifact_path="$RUNNER_TEMP/ConnectOnionMacClient-${version}.dmg"

          mkdir -p "$staging_path"
          ditto \
            "$archive_path/Products/Applications/ConnectOnionMacClient.app" \
            "$staging_path/ConnectOnionMacClient.app"
          ln -s /Applications "$staging_path/Applications"
          hdiutil create \
            -volname "ConnectOnion Mac Client" \
            -srcfolder "$staging_path" \
            -ov \
            -format UDZO \
            "$artifact_path"
          (
            cd "$RUNNER_TEMP"
            shasum -a 256 "$(basename "$artifact_path")" \
              > "$(basename "$artifact_path").sha256"
          )

      - name: Publish GitHub release
        run: |
          version="${GITHUB_REF_NAME#v}"
          artifact_path="$RUNNER_TEMP/ConnectOnionMacClient-${version}.dmg"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$artifact_path" \
              "${artifact_path}.sha256" \
              --clobber
          else
            notes_path="$RUNNER_TEMP/release-notes.md"
            cat > "$notes_path" <<'NOTES'
          ## Installation note

          The attached DMG is ad-hoc signed and not Apple-notarized. macOS may
          require an explicit **Open** from Finder's context menu. Verify the
          `.sha256` before opening it. The local-agent container image is
          published separately to GHCR and is pinned by this app version.
          NOTES
            prerelease_args=()
            [[ "$version" == *-* ]] && prerelease_args+=(--prerelease)
            notes=$(<"$notes_path")
            gh release create "$GITHUB_REF_NAME" \
              "$artifact_path" \
              "${artifact_path}.sha256" \
              --verify-tag \
              --generate-notes \
              --notes "$notes" \
              "${prerelease_args[@]}" \
              --title "ConnectOnion Mac Client ${version}"
          fi
