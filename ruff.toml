target-version = "py311"
line-length = 100
extend-exclude = [".co", ".tmp", ".venv"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "RUF"]
fixable = ["I"]

[lint.per-file-ignores]
"host_agent.py" = ["RUF001"]
"tests/test_host_agent.py" = ["RUF012"]
"tests/test_transcribe_audio.py" = ["RUF001"]
